
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CUENTITO</title>

    <link rel="stylesheet" href="index.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            line-height: 1.5;
            color: #222222;
        }

        h4 {
            font-size: 16px;
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body>

    <div class="book" id="book" tabindex="0" aria-label="Toca para abrir o cerrar el libro">

        <div class="cover">
            <img src="barco.png" alt="Portada del cuento">
        </div>

        <div class="page"></div>
        <div class="page"></div>
        <div class="page"></div>
        <div class="page"></div>
        <div class="page"></div>

        <div class="last-page">

            <a href="https://open.spotify.com/episode/6YSrGQVLIfpbRV5wiqWcBW?si=OzgnUdDlT-i7L8TTKTySzA">
                <img src="sjjs.png" alt="Escuchar Las dos estrellas">
            </a>

            <br>
            <br>
            <br>

            <center>
                <h3>¿Quieres escuchar un cuento?</h3>
            </center>

        </div>

        <div class="back-cover">
        </div>

    </div>

    <script>
        const book = document.getElementById("book");

        // Abrir y cerrar mediante toque o clic
        book.addEventListener("click", function(event) {

            // No activar la animación al pulsar el enlace
            if (event.target.closest("a")) {
                return;
            }

            book.classList.toggle("open");

        });

        // Accesibilidad mediante teclado
        book.addEventListener("keydown", function(event) {

            if (event.target !== book) return;

            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                book.classList.toggle("open");
            }

        });
    </script>

</body>
</html>
